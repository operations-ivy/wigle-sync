# pisugar-server (setup-pisugar.sh) retries the board's I2C every second when
# it can't reach it (pogo pins not touching, board not seated) and logs three
# lines each time, and pisugar-watch's polls add three more lines each. That
# filled the 64 MB journal every 40 minutes on scootypuffsr (2026-11-18) and
# rotated away everything else, so cap it: 30 lines per 10 minutes, with a
# "suppressed N messages" line from journald when it drops some.
[Service]
LogRateLimitIntervalSec=10min
LogRateLimitBurst=30
