# DHCP only (port=0 turns DNS off) for phones on the Kismet AP. No router or DNS
# options, so a phone keeps using mobile data for everything but 192.168.50.0/24.
interface=wlan_ap
bind-dynamic
except-interface=lo
port=0
dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
