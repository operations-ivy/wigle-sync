# Keep the journal across reboots (#48). Raspberry Pi OS keeps it in RAM to
# spare the SD card (40-rpi-volatile-storage.conf), but then a drive's
# Kismet, Bluetooth and USB messages are gone by the time the Pi is home.
# Capped, and synced every minute: the Pi's power is pulled, never shut down.
[Journal]
Storage=persistent
SystemMaxUse=64M
SyncIntervalSec=1m
