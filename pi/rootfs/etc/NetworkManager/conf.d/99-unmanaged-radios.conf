# Radios NetworkManager must not touch. Keep ALL entries in this ONE file:
# unmanaged-devices in a later conf.d file REPLACES the value from an earlier one.
#  - wlan_ap: hostapd (kismet-ap.service)
#  - wlan_mon*: Kismet capture sources
[keyfile]
unmanaged-devices=interface-name:wlan_ap;interface-name:wlan_mon*
