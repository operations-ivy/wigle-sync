# Memory on the Pi Zero 2 W (setup-zero2w.sh). With swap in zram, swapping
# is cheap (no disk), so idle pages go there rather than the page cache
# shrinking; and a little more is kept free for the USB and Wi-Fi drivers'
# atomic allocations, which fail rather than wait.
vm.swappiness = 100
vm.min_free_kbytes = 8192
