# Kismet on a 512 MB Pi Zero 2 W (setup-zero2w.sh installs this as
# /etc/kismet/kismet_lowmem.conf; kismet_site.conf includes it when present).
# brick69 (1 GB) showed Kismet adding 70-125 MB over a drive, growing with
# every device it has heard, so the device tracker is what's capped here.
# Logging is untouched: a device dropped from memory is already in the
# .kismet and .wiglecsv logs, and if it's heard again it's simply tracked anew.

# Forget a device not heard for 10 minutes (in a car, it's long gone).
tracker_device_timeout=600
# And never track more than this many at once; the oldest go first.
tracker_max_devices=4000

# Per-device history nobody reads on the road.
keep_location_cloud_history=false
keep_datasource_signal_history=false

# Fewer alerts held for the (unreachable) web UI.
alertbacklog=25
