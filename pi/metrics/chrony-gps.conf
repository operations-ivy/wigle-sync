# GPS time from gpsd (shared memory segment 0: NMEA sentences, good to about
# 0.1 s) for when the Pi is away from the internet: it has no RTC, so
# otherwise its clock would run on from the last shutdown. The large delay
# keeps it a fallback: at home chrony prefers the internet pools in
# chrony.conf, which are far more precise. setup-metrics.sh installs this.
refclock SHM 0 refid GPS poll 3 precision 1e-1 delay 0.5
