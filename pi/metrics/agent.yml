# The Prometheus agent on the wardriving Pi (setup-metrics.sh). It scrapes the
# local node-exporter (with pi-metrics.py's readings) and remote-writes to the
# cluster's Prometheus. Away from home the writes fail and wait in the agent's
# WAL; back home it sends the backlog, which Prometheus accepts up to 24h old
# (brick-k8s-config: outOfOrderTimeWindow). The Pi's clock comes from GPS
# away from home (chrony), so those samples carry the right time.
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: brick69-node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: brick69
    # The wifi collector also lists every phone on the Pi's own AP by MAC
    # address: keep only the home Wi-Fi link.
    metric_relabel_configs:
      - source_labels: [__name__, device]
        regex: "node_wifi_station_.+;(wlan_ap|wlan_mon.*)"
        action: drop
remote_write:
  - url: https://prometheus.brick.nozdormu.cloud/api/v1/write
    queue_config:
      max_backoff: 5m
