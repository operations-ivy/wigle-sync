# Kismet's Wi-Fi capture with WIFI_SPLIT=1 (bootstrap.sh installs this as
# /etc/kismet/kismet_wifi.conf): two radios, one per band, so each channel is
# heard about twice as often on the move as with one radio hopping both.
# wlan_mon0 keeps to 5 GHz and wlan_mon1 (a 2.4 GHz dongle) to 2.4 GHz; Kismet
# still finds each radio's channels itself (its band24ghz/band5ghz options).
source=wlan_mon0:band5ghz=true
source=wlan_mon1:band24ghz=true
