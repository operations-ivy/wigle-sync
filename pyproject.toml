[tool.poetry]
name = "wigle_sync"
version = "0.1.15"
description = "Pull .kismet/.wiglecsv wardriving logs off a Raspberry Pi and upload them to wigle.net"
authors = ["Patrick White <whitep@alumni.vcu.edu>"]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
paramiko = "^3.5.1"
python-dotenv = "^1.1.0"
prometheus-client = "^0.22.0"
opentelemetry-api = "^1.44.0"
brick-observe = { git = "https://github.com/operations-ivy/brick-observe.git", tag = "v0.1.1", extras = ["flask", "requests"] }
flask = "^3.1.0"
confluent-kafka = "2.16.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
pytest = "^8.3.5"

[build-system]
requires = ["poetry>=1.3.2"]
build-backend = "poetry.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Imports only: flake8 does the linting (.pre-commit-config.yaml).
select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false
required-imports = ["from __future__ import annotations"]
known-first-party = ["tests"]
