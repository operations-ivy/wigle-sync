apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wigle-console
  namespace: wigle
spec:
  ingressClassName: traefik
  rules:
  # Served through brick9000's proxy (brick-cicd-config). The .local name
  # goes once nothing uses it.
  - host: wigle.brick.nozdormu.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wigle-console
            port:
              number: 80
  - host: wigle.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wigle-console
            port:
              number: 80
