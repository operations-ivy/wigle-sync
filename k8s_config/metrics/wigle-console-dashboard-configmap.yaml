# Grafana dashboard for wigle-console's /metrics (console_metrics.py,
# console-podmonitor.yaml). Grafana's sidecar loads any ConfigMap labelled
# grafana_dashboard, in any namespace.
apiVersion: v1
kind: ConfigMap
