<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wigle_sync — wigle.local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Palette, type and HUD chrome shared with chucks-wisdom's reader console. */
:root{
  --bg:#07050f;
  --panel:#0e0a1e;
  --panel-2:#120d24;
  --line:#241a44;
  --line-bright:#3a2a6e;
  --text:#e7e3ff;
  --text-dim:#8b84b8;
  --text-faint:#5c5488;
  --magenta:#ff2a6d;
  --cyan:#05d9e8;
  --amber:#f9c80e;
  --violet:#9d4edd;
  --acid:#39ff88;
  --danger:#ff3860;
  --font-display:'Orbitron',"Segoe UI",sans-serif;
  --font-ui:'Rajdhani',"Segoe UI",sans-serif;
  --font-mono:'Share Tech Mono','Courier New',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--bg); color:var(--text); font-family:var(--font-ui); min-height:100vh; }
::selection{background:var(--magenta);color:#07050f;}
a{color:var(--cyan);}

.scanlines{
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 2px, transparent 3px);
  mix-blend-mode:overlay;
}
/* One narrow column: everything worth reading fits on a phone screen or half a laptop one. */
.wrap{ position:relative; z-index:3; max-width:720px; margin:0 auto; padding:18px 16px 40px; display:flex; flex-direction:column; gap:14px; }

.hud{
  border:1px solid var(--line-bright); background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border-radius:6px; padding:16px 18px; position:relative; overflow:hidden;
  box-shadow:0 0 0 1px rgba(5,217,232,0.08), 0 18px 60px -30px rgba(255,42,109,0.35);
}
.hud::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--magenta), var(--cyan), var(--violet), var(--magenta));
  background-size:200% 100%; animation:sweep 6s linear infinite;
}
@keyframes sweep{ to{ background-position:200% 0; } }
.hud-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.brand-title{
  font-family:var(--font-display); font-weight:900; font-size:clamp(26px,6vw,36px); letter-spacing:.03em; margin:0; line-height:1;
  text-shadow:0 0 18px rgba(255,42,109,0.55), 0 0 42px rgba(5,217,232,0.25);
}
.brand-title .accent{ color:var(--magenta); }
.clock{ font-family:var(--font-mono); font-size:13px; color:var(--text-dim); }
.links{
  margin-top:10px; font-family:var(--font-mono); font-size:12.5px; color:var(--text-faint);
  display:flex; flex-wrap:wrap; gap:4px 16px;
}
.links b{ color:var(--acid); font-weight:400; }
.links b.warn{ color:var(--danger); }
.links b.idle{ color:var(--amber); }

.stat-row{ margin-top:14px; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
@media (min-width:600px){ .stat-row{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
.stat{ border:1px solid var(--line); background:rgba(255,255,255,0.02); border-radius:4px; padding:10px 12px; min-width:0; }
.stat .n{
  font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--text);
  font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.stat .l{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; color:var(--text-faint); text-transform:uppercase; }
.stat .sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat.cy .n{ color:var(--cyan); text-shadow:0 0 12px rgba(5,217,232,.6); }
.stat.mag .n{ color:var(--magenta); text-shadow:0 0 12px rgba(255,42,109,.6); }
.stat.ok .n{ color:var(--acid); text-shadow:0 0 12px rgba(57,255,136,.5); }
.stat.idle .n{ color:var(--amber); text-shadow:0 0 12px rgba(249,200,14,.5); }
.stat.bad{ border-color:var(--danger); }
.stat.bad .n{ color:var(--danger); text-shadow:0 0 12px rgba(255,56,96,.6); }

.panel{
  border:1px solid var(--line); border-radius:6px; padding:12px 16px 14px;
  background:linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%); min-width:0;
}
.panel[hidden]{ display:none; }
.panel-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.panel-head h2{ font-family:var(--font-mono); font-size:13px; font-weight:400; letter-spacing:.08em; color:var(--text); margin:0; }
.panel-head .meta{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); text-align:right; }

/* 96h of hourly runs as one strip: tall = uploaded, short = home but nothing new, a sliver = away. */
.bars{ display:flex; align-items:flex-end; gap:2px; height:44px; border-bottom:1px solid var(--line); }
.bars .b{ flex:1 1 0; min-width:1px; border-radius:1px 1px 0 0; background:var(--line-bright); }
.bars .b.home{ background:var(--cyan); }
.bars .b.upl{ background:var(--acid); }
.bars .b.held{ background:var(--amber); }
.bars .b.fail{ background:var(--danger); }
.legend{ display:flex; flex-wrap:wrap; gap:4px 14px; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-top:8px; }
.legend i{ display:inline-block; width:8px; height:8px; margin-right:5px; border-radius:1px; }

.ranks{ display:flex; flex-wrap:wrap; gap:4px 22px; font-family:var(--font-mono); font-size:13px; color:var(--text-dim); margin-bottom:10px; }
.ranks b{ color:var(--text); font-weight:400; }
.up{ color:var(--acid); }
.down{ color:var(--danger); }

.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12.5px; }
th{
  text-align:left; font-weight:400; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-faint); padding:5px 10px 5px 0; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{ padding:6px 10px 6px 0; border-bottom:1px dashed var(--line); color:var(--text-dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
td.name{ color:var(--text); white-space:normal; overflow-wrap:anywhere; }
th.num, td.num{ text-align:right; }

.verdict{
  display:inline-block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  padding:2px 6px; border-radius:3px; border:1px solid currentColor;
}
.verdict.ok{ color:var(--acid); }
.verdict.bad{ color:var(--danger); }
.verdict.idle{ color:var(--amber); }
.verdict.info{ color:var(--cyan); }

.toggle{
  margin-top:8px; background:none; border:1px solid var(--line); color:var(--text-faint); font-family:var(--font-mono);
  font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:4px 8px; border-radius:3px; cursor:pointer;
}
.toggle:hover{ border-color:var(--cyan); color:var(--cyan); }
.toggle:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

.fault{ border-left:3px solid var(--danger); padding:6px 10px; margin-bottom:6px; font-family:var(--font-mono); font-size:12.5px; background:rgba(255,56,96,0.04); }
.fault.warning{ border-left-color:var(--amber); background:rgba(249,200,14,0.04); }
.fault .top{ display:flex; gap:10px; color:var(--text); }
.fault .when{ margin-left:auto; color:var(--text-faint); }
.fault .detail{ color:var(--text-dim); margin-top:3px; overflow-wrap:anywhere; }

.empty{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-faint); padding:10px 0; }
.src-err{ font-family:var(--font-mono); font-size:12px; color:var(--danger); overflow-wrap:anywhere; }

footer{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); text-align:center; }

@media (prefers-reduced-motion: reduce){ .hud::before{ animation:none; } }
</style>
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<div class="wrap">

  <header class="hud">
    <div class="hud-top">
      <h1 class="brand-title">wigle<span class="accent">_</span>sync</h1>
      <div class="clock" id="clock-time">00:00</div>
    </div>
    <div class="links">
      <span id="link-pi">pi <b class="idle">…</b></span>
      <span id="link-wigle">wigle.net <b class="idle">…</b></span>
      <span id="link-cron">cronjob <b class="idle">…</b></span>
    </div>
    <div class="stat-row" aria-live="polite">
      <div class="stat cy"><div class="n" id="s-next">--:--</div><div class="l">Next sync</div><div class="sub" id="s-next-sub">&nbsp;</div></div>
      <div class="stat" id="s-last-box"><div class="n" id="s-last">—</div><div class="l">Last sync</div><div class="sub" id="s-last-sub">&nbsp;</div></div>
      <div class="stat mag"><div class="n" id="s-uploaded">—</div><div class="l">Files uploaded</div><div class="sub" id="s-uploaded-sub">&nbsp;</div></div>
      <div class="stat mag"><div class="n" id="s-total">—</div><div class="l">All time</div><div class="sub">since launch</div></div>
    </div>
  </header>

  <section class="panel">
    <div class="panel-head"><h2>LAST 96H</h2><span class="meta" id="rl-meta"></span></div>
    <div id="rl-body"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>WIGLE</h2><span class="meta" id="q-meta"></span></div>
    <div id="q-body"></div>
  </section>

  <!-- Only shown when something actually went wrong. -->
  <section class="panel" id="f-panel" hidden>
    <div class="panel-head"><h2>FAULTS</h2><span class="meta">last 96h</span></div>
    <div id="f-body"></div>
  </section>

  <footer>Refreshes every 30s · <a href="http://grafana.local/d/wigle-sync">Grafana → WiGLE Sync</a></footer>
</div>

<script>
(function(){
  "use strict";

  var REFRESH_MS = 30000;
  var QUEUE_ROWS = 5;
  var FAULT_ROWS = 5;
  var state = { data: null, showAllQueue: false };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function $(id){ return document.getElementById(id); }
  function num(n){ return n == null ? "—" : Number(n).toLocaleString(); }
  function pad(n){ return String(n).padStart(2,"0"); }
  function plural(n, word){ return num(n) + " " + word + (n === 1 ? "" : "s"); }

  function bytes(n){
    if (n == null) return "—";
    var u = ["B","KB","MB","GB"], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i ? n.toFixed(1) : n) + " " + u[i];
  }
  function ago(ts){
    if (!ts) return "never";
    var s = Math.max(0, Math.round(Date.now() / 1000 - ts));
    if (s < 60) return s + "s ago";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60);
    if (h < 48) return h + "h ago";
    return Math.floor(h / 24) + "d ago";
  }
  function stamp(ts){
    if (!ts) return "—";
    var d = new Date(ts * 1000), now = new Date();
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return hm;
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
  }
  function srcErr(section){ return '<div class="src-err">source offline: ' + esc(section.error) + '</div>'; }
  function link(id, label, html){ $(id).innerHTML = label + " " + html; }

  // The last run that found the Pi home; runs while it's away don't replace these.
  // Until wigle-sync pushes last_sync_*, the per-run gauges are the best there is.
  function lastSync(lr){
    var have = lr.last_sync_files_uploaded != null;
    return {
      at: lr.last_pi_online_timestamp_seconds,
      uploaded: have ? lr.last_sync_files_uploaded : (lr.pi_online ? lr.files_uploaded : null),
      failed: have ? lr.last_sync_files_failed : (lr.pi_online ? lr.files_failed : 0),
      deferred: have ? lr.last_sync_files_deferred : 0
    };
  }

  /* ---------------- HUD ---------------- */
  function renderHud(d){
    var pi = d.pi, sch = d.schedule, lr = d.last_run, wg = d.wigle;

    if (pi.error) link("link-pi", "pi", '<b class="warn">probe failed</b>');
    else if (pi.online_now) link("link-pi", "pi", "<b>home</b>");
    else link("link-pi", "pi", '<b class="idle">away</b>' + (lr.error ? "" : " · seen " + ago(lr.last_pi_online_timestamp_seconds)));

    link("link-wigle", "wigle.net", wg.error ? '<b class="warn">unreachable</b>' : "<b>linked</b> as " + esc(wg.user));

    if (sch.error) link("link-cron", "cronjob", '<b class="warn">unknown</b>');
    else if (sch.suspended) link("link-cron", "cronjob", '<b class="warn">suspended</b>');
    else if (sch.failed_jobs_24h) link("link-cron", "cronjob", '<b class="warn">' + plural(sch.failed_jobs_24h, "failed job") + " in 24h</b>");
    else link("link-cron", "cronjob", "<b>armed</b>");

    var box = $("s-last-box");
    box.className = "stat";
    if (lr.error) { $("s-last").textContent = "—"; $("s-last-sub").textContent = "no metrics"; return; }
    var ls = lastSync(lr);
    if (sch.running) {
      $("s-last").textContent = "SYNCING"; box.classList.add("ok"); $("s-last-sub").textContent = "job running now";
    } else if (!ls.at) {
      $("s-last").textContent = "—"; $("s-last-sub").textContent = "pi never seen";
    } else if (ls.failed > 0) {
      $("s-last").textContent = "FAILED"; box.classList.add("bad");
      $("s-last-sub").textContent = plural(ls.failed, "file") + " · " + ago(ls.at);
    } else if (ls.deferred > 0) {
      // Not a fault: the internet was down, and the files wait on the Pi for the next run.
      $("s-last").textContent = "WAITING"; box.classList.add("idle");
      $("s-last-sub").textContent = "no internet · " + plural(ls.deferred, "file") + " held";
    } else {
      $("s-last").textContent = "OK"; box.classList.add("ok"); $("s-last-sub").textContent = ago(ls.at);
    }
    $("s-uploaded").textContent = num(ls.uploaded);
    $("s-uploaded-sub").textContent = "last sync · " + stamp(ls.at);
    $("s-total").textContent = num(lr.files_uploaded_since_launch);
  }

  function tickCountdown(){
    var d = state.data;
    if (!d || d.schedule.error) return;
    var sch = d.schedule;
    if (sch.suspended) { $("s-next").textContent = "PAUSED"; $("s-next-sub").textContent = "cronjob suspended"; return; }
    if (sch.running) { $("s-next").textContent = "NOW"; $("s-next-sub").textContent = "job running"; return; }
    var left = Math.round(sch.next_run - Date.now() / 1000);
    if (left <= 0) { $("s-next").textContent = "DUE"; $("s-next-sub").textContent = "waiting on scheduler"; return; }
    $("s-next").textContent = stamp(sch.next_run);
    $("s-next-sub").textContent = "in " + (left < 3600 ? Math.ceil(left / 60) + "m"
      : Math.floor(left / 3600) + "h " + pad(Math.floor(left % 3600 / 60)) + "m");
  }

  /* ---------------- panels ---------------- */
  function renderRunLog(d){
    var h = d.history;
    if (h.error) { $("rl-body").innerHTML = srcErr(h); $("rl-meta").textContent = ""; return; }
    var runs = h.runs;
    if (!runs.length) { $("rl-body").innerHTML = '<div class="empty">No runs logged in the last 96h.</div>'; return; }

    var chron = runs.slice(0, 96).reverse();
    var peak = Math.max.apply(null, chron.map(function(r){ return r.uploaded || 0; }).concat([1]));
    var home = 0, uploaded = 0;
    var bars = chron.map(function(r){
      if (r.pi_online) home++;
      uploaded += r.uploaded || 0;
      var cls = r.failed > 0 ? "fail" : r.uploaded > 0 ? "upl" : r.deferred > 0 ? "held" : r.pi_online ? "home" : "";
      var height = r.uploaded > 0 ? Math.max(30, Math.round(100 * r.uploaded / peak)) : r.pi_online ? 18 : 5;
      var tip = stamp(r.at) + " — " + (!r.pi_online ? "pi away"
        : r.uploaded + " uploaded" + (r.failed ? ", " + r.failed + " failed" : "") +
          (r.deferred ? ", " + r.deferred + " held (no internet)" : ""));
      return '<div class="b ' + cls + '" style="height:' + height + '%" title="' + esc(tip) + '"></div>';
    }).join("");

    $("rl-meta").textContent = plural(uploaded, "file") + " uploaded · pi home " + home + "/" + chron.length + " runs";
    $("rl-body").innerHTML = '<div class="bars" aria-hidden="true">' + bars + '</div>' +
      '<div class="legend"><span><i style="background:var(--acid)"></i>uploaded</span>' +
      '<span><i style="background:var(--cyan)"></i>nothing new</span>' +
      '<span><i style="background:var(--amber)"></i>no internet</span>' +
      '<span><i style="background:var(--danger)"></i>failed</span>' +
      '<span><i style="background:var(--line-bright)"></i>away</span></div>';
  }

  function rankDelta(now, prev){
    if (!now || !prev || now === prev) return "";
    var diff = prev - now;  // lower rank number is better
    return ' <small class="' + (diff > 0 ? "up" : "down") + '">' + (diff > 0 ? "▲" : "▼") + num(Math.abs(diff)) + '</small>';
  }

  function queueBadge(u){
    if (u.percent_done >= 100 || u.status === "D") return '<span class="verdict ok">done</span>';
    if (u.status === "W") return '<span class="verdict idle">queued</span>';
    if (u.status === "E") return '<span class="verdict bad">rejected</span>';
    return '<span class="verdict info">' + Math.round(u.percent_done || 0) + '%</span>';
  }

  function renderWigle(d){
    var w = d.wigle;
    if (w.error) { $("q-body").innerHTML = srcErr(w); $("q-meta").textContent = ""; return; }
    $("q-meta").textContent = "@" + w.user + " · " + stamp(w.fetched_at);
    var ranks = '<div class="ranks">' +
      '<span>rank <b>#' + num(w.rank) + '</b>' + rankDelta(w.rank, w.prev_rank) + '</span>' +
      '<span>month <b>#' + num(w.month_rank) + '</b>' + rankDelta(w.month_rank, w.prev_month_rank) + '</span>' +
      '<span>wifi w/ gps <b>' + num(w.wifi_gps) + '</b></span></div>';

    var ups = w.uploads;
    if (!ups.length) { $("q-body").innerHTML = ranks + '<div class="empty">No uploads on record.</div>'; return; }
    var shown = state.showAllQueue ? ups : ups.slice(0, QUEUE_ROWS);
    var more = ups.length > QUEUE_ROWS
      ? '<button class="toggle" id="toggle-queue" type="button">' +
        (state.showAllQueue ? "Show latest " + QUEUE_ROWS : "Show all " + ups.length) + '</button>'
      : "";
    $("q-body").innerHTML = ranks + '<div class="table-wrap"><table><thead><tr><th>Upload</th>' +
      '<th class="num">Size</th><th>Status</th><th class="num">New GPS</th></tr></thead><tbody>' +
      shown.map(function(u){
        return '<tr><td class="name">' + esc(u.file) + '</td><td class="num">' + bytes(u.size) + '</td>' +
          '<td>' + queueBadge(u) + '</td><td class="num">' + num(u.new_gps) + '</td></tr>';
      }).join("") + '</tbody></table></div>' + more;
    var t = $("toggle-queue");
    if (t) t.addEventListener("click", function(){
      state.showAllQueue = !state.showAllQueue;
      renderWigle(state.data);
    });
  }

  function renderFaults(d){
    var f = d.errors;
    if (f.error || !f.items.length) { $("f-panel").hidden = true; return; }
    $("f-panel").hidden = false;
    $("f-body").innerHTML = f.items.slice(0, FAULT_ROWS).map(function(e){
      return '<div class="fault ' + esc(e.level) + '"><div class="top"><span>' + esc(e.event) + '</span>' +
        (e.file ? '<span>' + esc(e.file) + '</span>' : "") + '<span class="when">' + stamp(e.at) + '</span></div>' +
        (e.detail ? '<div class="detail">' + esc(e.detail) + '</div>' : "") + '</div>';
    }).join("");
  }

  /* ---------------- loop ---------------- */
  function render(){
    var d = state.data;
    renderHud(d); renderRunLog(d); renderWigle(d); renderFaults(d);
    tickCountdown();
  }

  function load(){
    return fetch("/api/status").then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function(d){
      state.data = d;
      render();
    }).catch(function(err){
      link("link-cron", "console", '<b class="warn">' + esc(err.message) + '</b>');
    });
  }

  function tickClock(){
    var d = new Date();
    $("clock-time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    tickCountdown();
  }
  tickClock();
  setInterval(tickClock, 1000);
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
